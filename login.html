<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Forno & Chapa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <header class="topo">
    <a class="logo" href="index.html">Forno <span>&amp;</span> Chapa</a>
    <nav><a href="index.html">Cardápio</a><a href="cadastro.html">Criar conta</a></nav>
  </header>

  <main class="auth">
    <form id="form-login" class="card-form" novalidate>
      <h1>Entrar</h1>
      <div id="msg" class="msg" role="alert"></div>
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Entrar</button>
      <p class="ajuda">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
